services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: saferide-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - DATABASE_URL=${DATABASE_URL}
    env_file:
      - ./backend/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-}
    container_name: saferide-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
